{{ define "main" }}
  <article>
    {{- with .Description }}
    <hgroup>
      <h1>{{ $.Title }}</h1>
      <p>{{ . }}</p>
    </hgroup>
    {{- else }}
    <h1>{{ .Title }}</h1>
    {{- end }}
    {{- if eq .Section "posts" }}
    <p><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time></p>
    {{- end }}
    {{ .Content }}
  </article>
{{ end }}
