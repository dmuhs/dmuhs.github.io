name: Deploy to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Allow one concurrent deployment, and let an in-progress one finish.
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # >= 0.158.0 required: `locale` (hugo.toml) and `.Site.Language.Locale`
      # (legacyrss template) don't exist in earlier versions and fail the build.
      HUGO_VERSION: 0.169.0
    steps:
      - name: Install Hugo CLI (extended, for image processing)
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Restore processed images
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: resources/_gen
          key: hugo-${{ env.HUGO_VERSION }}-latest
          restore-keys: hugo-${{ env.HUGO_VERSION }}-
      - name: Build Hugo site
        run: hugo --gc --minify
      - name: Name the processed images
        id: images
        run: echo "key=hugo-${HUGO_VERSION}-$(find resources/_gen -type f | LC_ALL=C sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Save processed images
        if: steps.images.outputs.key != steps.restore.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: resources/_gen
          key: ${{ steps.images.outputs.key }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
