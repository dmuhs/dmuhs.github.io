baseURL = "https://spoons.fyi/"
locale = "en-us"
title = "spoons.fyi"
timeZone = "Europe/Berlin"       # match the old Pelican TIMEZONE (dates in feeds / <time>)
disableKinds = ["taxonomy", "term"]
disableAliases = true

[params]
  author = "Dominik Muhs"
  email = "spoons.fyi@pm.me"

# Each post/page pins its exact path via the `url` front-matter key, because the
# slug rarely matches the bundle directory name (a Pelican-migration artifact).
# The old Pelican ".html" paths are preserved as `aliases`, which the `redirects`
# output format writes to `_redirects`, so Cloudflare answers them with a 301.

[permalinks]
  posts = "/:year/:month/:day/:slug/"

[markup]
  [markup.goldmark.parser]
    # Don't wrap a standalone image in <p>, so the render hook's block-level
    # <figure> is valid HTML (no empty paragraphs around each image).
    wrapStandAloneImageWithinParagraph = false
  [markup.highlight]
    noClasses = false

# Legacy RSS feed at the exact old path /feeds/all.rss.xml (footer subscribe link).
[outputFormats.rss]
  baseName = "all.rss"

[mediaTypes."text/redirects"]
  delimiter = ""

[outputFormats.redirects]
  mediaType = "text/redirects"
  baseName = "_redirects"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "redirects"]
  section = ["html"]
